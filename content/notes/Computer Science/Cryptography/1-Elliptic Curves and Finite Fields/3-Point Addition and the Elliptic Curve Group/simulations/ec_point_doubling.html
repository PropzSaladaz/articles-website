<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="sim-paper" content="full">
  <title>ECC Tangent Limit & Doubling Demonstration</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="sk-page w-screen h-screen overflow-hidden m-0 p-0 relative flex items-center justify-center select-none">

  <!-- Fullscreen Canvas -->
  <canvas id="curveCanvas" class="absolute inset-0 w-full h-full block"></canvas>

  <script>
    const canvas = document.getElementById('curveCanvas');
    const sk = Sketch.attach(canvas);

    // Shared curve style: matches ec_point_addition.html's CURVE_STYLE for
    // consistency across the whole Point Addition / Doubling sim family.
    const CURVE_STYLE = { width: 3, roughness: 0.6, ink: 'pencil' };

    // Curve Parameters (y^2 = x^3 + ax + b)
    const curve = {
      a: -3.0,
      b: 3.5
    };

    // State Variables
    let state = {
      zoom: 65,
      time: 0.0,
      p: { x: 0, y: 0 },
      q: { x: 0, y: 0 },
      pauseFrames: 0,
      wasMerged: false
    };

    // Cardanos formula solver to find leftmost root
    function findLeftmostRoot(a, b) {
      const p = a;
      const q = b;
      const Q = p / 3;
      const R = -q / 2;
      const disc = Q*Q*Q + R*R;

      if (disc >= 0) {
        const s = Math.sign(R + Math.sqrt(disc)) * Math.pow(Math.abs(R + Math.sqrt(disc)), 1/3);
        const t = Math.sign(R - Math.sqrt(disc)) * Math.pow(Math.abs(R - Math.sqrt(disc)), 1/3);
        return s + t;
      } else {
        const theta = Math.acos(R / Math.sqrt(-Q*Q*Q));
        const sqrt_Q = Math.sqrt(-Q);
        const r1 = 2 * sqrt_Q * Math.cos(theta / 3);
        const r2 = 2 * sqrt_Q * Math.cos((theta + 2 * Math.PI) / 3);
        const r3 = 2 * sqrt_Q * Math.cos((theta + 4 * Math.PI) / 3);
        return Math.min(r1, r2, r3);
      }
    }

    // Refine root calculation using Newton-Raphson to ensure perfect nose accuracy
    let minRootX = findLeftmostRoot(curve.a, curve.b);
    for (let i = 0; i < 5; i++) {
      const f = minRootX*minRootX*minRootX + curve.a*minRootX + curve.b;
      const df = 3*minRootX*minRootX + curve.a;
      if (Math.abs(df) > 1e-12) {
        minRootX -= f / df;
      }
    }

    // Evaluate y coordinate of the curve with floating point safety guard
    function getECY(x) {
      const val = x*x*x + curve.a*x + curve.b;
      if (val < 0) {
        if (val > -1e-5) return 0; // Guard against tiny floating point noise near the root
        return null;
      }
      return Math.sqrt(val);
    }

    // Coordinate translation functions
    function toScreenX(mathX) {
      return canvas.width / 2 + mathX * state.zoom;
    }

    function toScreenY(mathY) {
      return canvas.height / 2 - mathY * state.zoom;
    }

    function toMathX(screenX) {
      return (screenX - canvas.width / 2) / state.zoom;
    }

    function toMathY(screenY) {
      return (canvas.height / 2 - screenY) / state.zoom;
    }

    // Translate smooth orbital phase parameter [0, 2pi] to valid coordinate (x,y)
    function getPointAtPhase(phase) {
      const cosVal = Math.cos(phase);
      const sinVal = Math.sin(phase);

      const xRange = 3.5 - minRootX;
      const x = minRootX + (0.5 + 0.5 * cosVal) * xRange;

      const rawY = getECY(x);
      const y = (sinVal >= 0) ? rawY : -rawY;

      return { x, y };
    }

    // Draw the continuous single-component curve perfectly closed at the nose
    function drawCurve() {
      const steps = 44;
      const limitX = toMathX(canvas.width + 100);
      const pts = [];

      // Trace bottom branch from infinity back to the nose
      for (let i = steps; i >= 0; i--) {
        const norm = i / steps;
        const x = minRootX + Math.pow(norm, 2.5) * (limitX - minRootX);
        const y = getECY(x);
        if (y !== null) pts.push([toScreenX(x), toScreenY(-y)]);
      }

      // Hit precise refined nose point
      pts.push([toScreenX(minRootX), toScreenY(0)]);

      // Trace top branch forward to infinity
      for (let i = 0; i <= steps; i++) {
        const norm = i / steps;
        const x = minRootX + Math.pow(norm, 2.5) * (limitX - minRootX);
        const y = getECY(x);
        if (y !== null) pts.push([toScreenX(x), toScreenY(y)]);
      }

      sk.curve(pts, CURVE_STYLE);
    }

    // Line calculation & drawing
    function drawAddition() {
      const P = state.p;
      const Q = state.q;

      let m, x3, y3;
      let isTangent = false;

      // Determine the distance between Q and P
      const distance = Math.hypot(Q.x - P.x, Q.y - P.y);

      if (distance < 0.02 || state.pauseFrames > 0) {
        // Tangent slope calculation (P == Q)
        m = (3 * P.x * P.x + curve.a) / (2 * P.y);
        isTangent = true;

        // Snap Q to P visually
        Q.x = P.x;
        Q.y = P.y;

        x3 = m * m - 2 * P.x;
        y3 = m * (P.x - x3) - P.y;
      } else {
        // Secant slope calculation
        m = (Q.y - P.y) / (Q.x - P.x);

        x3 = m * m - P.x - Q.x;
        y3 = m * (P.x - x3) - P.y;
      }

      // Smooth ink+width transition based on proximity: purple (far, secant)
      // to red (near, tangent) — same interpolation as the original, re-based
      // on the paper ink palette instead of the dark-theme hex values.
      const maxDistanceForTransition = 1.0;
      const t = Math.max(0, Math.min(1, 1 - distance / maxDistanceForTransition)); // 0 (far) to 1 (overlapping)

      const from = [0x6b, 0x4d, 0x9e]; // ink.purple
      const to = [0xc3, 0x4a, 0x3d];   // ink.red
      const r = Math.round(from[0] + (to[0] - from[0]) * t);
      const g = Math.round(from[1] + (to[1] - from[1]) * t);
      const b = Math.round(from[2] + (to[2] - from[2]) * t);
      const lineInk = `rgb(${r}, ${g}, ${b})`;
      const lineWidth = 1.5 + 2.0 * t;

      // Make the line solid as it approaches tangent, dashed when far away
      const rulerOpts = { ink: lineInk, width: lineWidth };
      if (t < 0.95 && !isTangent) {
        const dashLength = 4 + 6 * t;
        const gapLength = 4 * (1 - t);
        if (gapLength > 0.2) rulerOpts.dash = [dashLength, gapLength];
      }

      // Secant/tangent line: ruler(), not curve()/line() — this must
      // visibly pass exactly through P and Q (or be exactly tangent at P),
      // which hand-drawn wobble would undermine rather than decorate.
      const xLeft = toMathX(-100);
      const xRight = toMathX(canvas.width + 100);
      sk.ruler(
        toScreenX(xLeft), toScreenY(P.y + m * (xLeft - P.x)),
        toScreenX(xRight), toScreenY(P.y + m * (xRight - P.x)),
        rulerOpts
      );

      // Draw horizontal cross root R' = (x3, -y3)
      const rPrimeX = x3;
      const rPrimeY = -y3;
      drawMarker(rPrimeX, rPrimeY, 'pink', "R'", true);

      // Draw reflection trace line — same exactness reasoning as above.
      sk.ruler(toScreenX(rPrimeX), toScreenY(rPrimeY), toScreenX(x3), toScreenY(y3), { ink: 'orange', width: 1.5, dash: [2, 4] });

      // Draw final Addition point P + Q / 2P
      const sumLabel = isTangent ? '2P' : 'P + Q';
      drawMarker(x3, y3, 'orange', sumLabel, false, isTangent);

      // Draw P Marker
      drawMarker(P.x, P.y, 'green', 'P (Fixed)');

      // Draw Q Marker (only draw separately if they aren't fully merged)
      if (!isTangent) {
        drawMarker(Q.x, Q.y, 'blue', 'Q');
      } else {
        // Highlight tangent intersection at P
        drawMarker(P.x, P.y, 'red', 'P = Q (Tangent)', false, true);
      }
    }

    function drawMarker(mx, my, ink, label, isGhost = false, isHighlighted = false) {
      const sx = toScreenX(mx);
      const sy = toScreenY(my);

      if (sx < 0 || sx > canvas.width || sy < 0 || sy > canvas.height) return;

      const coreRadius = isGhost ? 3 : (isHighlighted ? 7 : 5);

      // Highlight halo: a hachure-filled circle stands in for the old glow.
      // Boil left on (matching the core dot below) so the two don't desync.
      if (isHighlighted) {
        sk.circle(sx, sy, coreRadius + 7, { ink, fill: ink, fillStyle: 'hachure', roughness: 0.8 });
      }

      // Solid core dot
      sk.circle(sx, sy, coreRadius, { ink, fill: ink, fillStyle: 'solid', roughness: 0.6 });

      // Label
      sk.text(label, sx + 14, sy - 6, { ink, size: isHighlighted ? 17 : 15, boil: false });
    }

    // Draw & update loop
    function draw() {
      sk.clear({ paper: false });
      sk.grid({ originX: canvas.width / 2, originY: canvas.height / 2, step: state.zoom });
      sk.axes({ originX: canvas.width / 2, originY: canvas.height / 2, step: state.zoom, ink: 'pencil' });
      drawCurve();
      drawAddition();
    }

    function animationLoop() {
      // P is locked at a visible location
      const phaseP = 1.4;
      state.p = getPointAtPhase(phaseP);

      // Determine proximity of Q to P to trigger/maintain the pause
      const s = Math.sin(state.time);
      const offset = s * s * s * 1.0;
      const phaseQ = phaseP + offset;

      const tempQ = getPointAtPhase(phaseQ);
      const distance = Math.hypot(tempQ.x - state.p.x, tempQ.y - state.p.y);

      // Pause Trigger condition: when Q is extremely close to P and was not previously merged
      if (distance < 0.02 && !state.wasMerged) {
        state.pauseFrames = 60; // Hold the tangent doubling for 1 second (~60 frames)
        state.wasMerged = true;
      }

      // Reset merge blocker when Q sweeps far enough away
      if (distance > 0.1) {
        state.wasMerged = false;
      }

      if (state.pauseFrames > 0) {
        state.pauseFrames--;
        // While paused, lock Q exactly on top of P
        state.q = { x: state.p.x, y: state.p.y };
      } else {
        state.time += 0.01; // Advance timeline normally
        state.q = tempQ;
      }

      draw();
      requestAnimationFrame(animationLoop);
    }

    function initCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      state.zoom = Math.min(canvas.width, canvas.height) / 7.5;
      draw();
    }

    window.addEventListener('resize', initCanvas);
    window.onload = () => {
      initCanvas();
      animationLoop();
    };
  </script>
</body>
</html>
