<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noise Heightmap</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101820;
      --panel: #17232d;
      --panel-strong: #1d2d39;
      --line: rgba(189, 220, 231, 0.18);
      --text: #e8f1f3;
      --muted: #9eb2b9;
      --accent: #7dd3c7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 10% 0%, #203743 0, var(--bg) 46%);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app { max-width: 1180px; margin: 0 auto; padding: 20px; }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); letter-spacing: -0.03em; }
    header p { margin: 4px 0 0; color: var(--muted); }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      gap: 16px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(23, 35, 45, 0.88);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
    }

    .map-card { padding: 12px; }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      min-height: 260px;
      border-radius: 9px;
      background: #183247;
      image-rendering: auto;
    }

    .map-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 4px 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend { display: flex; flex-wrap: wrap; gap: 9px; }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .swatch { width: 10px; height: 10px; border-radius: 3px; }

    .controls { padding: 16px; }
    .controls h2 { margin: 0 0 14px; font-size: 15px; }
    .control { margin: 0 0 15px; }
    .control-top { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
    label { color: var(--text); }
    output { color: var(--accent); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 7px 8px;
      background: var(--panel-strong);
      color: var(--text);
    }

    button {
      width: 100%;
      border: 1px solid rgba(125, 211, 199, 0.5);
      border-radius: 8px;
      padding: 9px 10px;
      background: rgba(125, 211, 199, 0.12);
      color: var(--text);
      cursor: pointer;
      font-weight: 650;
    }

    button:hover { background: rgba(125, 211, 199, 0.2); }

    .readout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .stat { padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.035); }
    .stat small { display: block; color: var(--muted); }
    .stat strong { font-variant-numeric: tabular-nums; }

    @media (max-width: 760px) {
      .app { padding: 12px; }
      header { display: block; }
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>From noise to terrain</h1>
        <p>A normalized fBm field interpreted as a terrain heightmap.</p>
      </div>
    </header>

    <div class="layout">
      <section class="card map-card">
        <canvas id="map" width="320" height="192" aria-label="Generated terrain heightmap"></canvas>
        <div class="map-footer">
          <div class="legend">
            <span><i class="swatch" style="background:#1c6090"></i>water</span>
            <span><i class="swatch" style="background:#d7b56d"></i>beach</span>
            <span><i class="swatch" style="background:#5f9b62"></i>land</span>
            <span><i class="swatch" style="background:#9b9b91"></i>rock</span>
            <span><i class="swatch" style="background:#eef1ed"></i>snow</span>
          </div>
          <span id="status">320 × 192 samples</span>
        </div>
      </section>

      <aside class="card controls">
        <h2>Field parameters</h2>

        <div class="control">
          <div class="control-top"><label for="seed">Seed</label></div>
          <input id="seed" type="number" min="0" max="999999" step="1" value="17">
        </div>

        <div class="control">
          <div class="control-top"><label for="scale">Feature scale</label><output id="scale-value">76</output></div>
          <input id="scale" type="range" min="32" max="150" step="1" value="76">
        </div>

        <div class="control">
          <div class="control-top"><label for="octaves">Octaves</label><output id="octaves-value">5</output></div>
          <input id="octaves" type="range" min="1" max="8" step="1" value="5">
        </div>

        <div class="control">
          <div class="control-top"><label for="persistence">Persistence</label><output id="persistence-value">0.55</output></div>
          <input id="persistence" type="range" min="0.25" max="0.85" step="0.05" value="0.55">
        </div>

        <div class="control">
          <div class="control-top"><label for="lacunarity">Lacunarity</label><output id="lacunarity-value">2.00×</output></div>
          <input id="lacunarity" type="range" min="1.5" max="3.2" step="0.1" value="2">
        </div>

        <div class="control">
          <div class="control-top"><label for="sea">Sea level</label><output id="sea-value">0.38</output></div>
          <input id="sea" type="range" min="0.18" max="0.58" step="0.01" value="0.38">
        </div>

        <button id="randomize" type="button">Generate another seed</button>

        <div class="readout">
          <div class="stat"><small>sample minimum</small><strong id="min">—</strong></div>
          <div class="stat"><small>sample maximum</small><strong id="max">—</strong></div>
          <div class="stat"><small>sample average</small><strong id="average">—</strong></div>
          <div class="stat"><small>amplitude sum</small><strong id="amplitude">—</strong></div>
        </div>
      </aside>
    </div>
  </main>

  <script>
    'use strict';

    const canvas = document.getElementById('map');
    const context = canvas.getContext('2d');
    const sampleWidth = canvas.width;
    const sampleHeight = canvas.height;
    const gradients = [
      [1, 0], [-1, 0], [0, 1], [0, -1],
      [0.707, 0.707], [-0.707, 0.707], [0.707, -0.707], [-0.707, -0.707]
    ];

    const controls = {
      seed: document.getElementById('seed'),
      scale: document.getElementById('scale'),
      octaves: document.getElementById('octaves'),
      persistence: document.getElementById('persistence'),
      lacunarity: document.getElementById('lacunarity'),
      sea: document.getElementById('sea')
    };

    let permutation = [];

    function seededPermutation(seed) {
      const values = Array.from({ length: 256 }, (_, index) => index);
      let state = (Number(seed) >>> 0) || 1;
      const random = () => {
        state ^= state << 13;
        state ^= state >>> 17;
        state ^= state << 5;
        return (state >>> 0) / 4294967296;
      };

      for (let index = values.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(random() * (index + 1));
        [values[index], values[swapIndex]] = [values[swapIndex], values[index]];
      }
      return values.concat(values);
    }

    function fade(value) {
      return value * value * value * (value * (value * 6 - 15) + 10);
    }

    function lerp(a, b, amount) {
      return a + amount * (b - a);
    }

    function gradientAt(x, y) {
      const hash = permutation[(permutation[x & 255] + (y & 255)) & 255] & 7;
      return gradients[hash];
    }

    function dotGradient(x, y, dx, dy) {
      const gradient = gradientAt(x, y);
      return gradient[0] * dx + gradient[1] * dy;
    }

    function perlin2D(x, y) {
      const x0 = Math.floor(x);
      const y0 = Math.floor(y);
      const dx = x - x0;
      const dy = y - y0;
      const u = fade(dx);
      const v = fade(dy);
      const n00 = dotGradient(x0, y0, dx, dy);
      const n10 = dotGradient(x0 + 1, y0, dx - 1, dy);
      const n01 = dotGradient(x0, y0 + 1, dx, dy - 1);
      const n11 = dotGradient(x0 + 1, y0 + 1, dx - 1, dy - 1);
      return lerp(lerp(n00, n10, u), lerp(n01, n11, u), v);
    }

    function fbm(x, y, octaves, lacunarity, persistence) {
      let frequency = 1;
      let amplitude = 1;
      let value = 0;
      let amplitudeSum = 0;

      for (let octave = 0; octave < octaves; octave += 1) {
        value += amplitude * perlin2D(x * frequency, y * frequency);
        amplitudeSum += amplitude;
        frequency *= lacunarity;
        amplitude *= persistence;
      }

      return { value: value / amplitudeSum, amplitudeSum };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function mix(a, b, amount) {
      return [
        Math.round(lerp(a[0], b[0], amount)),
        Math.round(lerp(a[1], b[1], amount)),
        Math.round(lerp(a[2], b[2], amount))
      ];
    }

    function terrainColor(height, sea) {
      if (height < sea) {
        const depth = clamp((sea - height) / Math.max(sea, 0.01), 0, 1);
        return mix([41, 125, 166], [11, 48, 91], depth);
      }
      if (height < sea + 0.055) {
        return mix([215, 181, 109], [197, 162, 92], (height - sea) / 0.055);
      }
      if (height < 0.64) {
        return mix([73, 133, 79], [119, 151, 83], (height - sea - 0.055) / 0.255);
      }
      if (height < 0.82) {
        return mix([119, 151, 83], [137, 132, 116], (height - 0.64) / 0.18);
      }
      return mix([137, 132, 116], [238, 241, 237], (height - 0.82) / 0.18);
    }

    function updateLabels() {
      document.getElementById('scale-value').textContent = controls.scale.value;
      document.getElementById('octaves-value').textContent = controls.octaves.value;
      document.getElementById('persistence-value').textContent = Number(controls.persistence.value).toFixed(2);
      document.getElementById('lacunarity-value').textContent = Number(controls.lacunarity.value).toFixed(2) + '×';
      document.getElementById('sea-value').textContent = Number(controls.sea.value).toFixed(2);
    }

    function render() {
      updateLabels();
      permutation = seededPermutation(controls.seed.value);

      const scale = Number(controls.scale.value);
      const octaves = Number(controls.octaves.value);
      const persistence = Number(controls.persistence.value);
      const lacunarity = Number(controls.lacunarity.value);
      const sea = Number(controls.sea.value);
      const pixels = context.createImageData(sampleWidth, sampleHeight);
      let min = Infinity;
      let max = -Infinity;
      let sum = 0;

      for (let y = 0; y < sampleHeight; y += 1) {
        for (let x = 0; x < sampleWidth; x += 1) {
          const sampleX = (x - sampleWidth / 2) / scale;
          const sampleY = (y - sampleHeight / 2) / scale;
          const field = fbm(sampleX, sampleY, octaves, lacunarity, persistence);
          const height = clamp(0.5 + field.value, 0, 1);
          const color = terrainColor(height, sea);
          const offset = (y * sampleWidth + x) * 4;
          pixels.data[offset] = color[0];
          pixels.data[offset + 1] = color[1];
          pixels.data[offset + 2] = color[2];
          pixels.data[offset + 3] = 255;
          min = Math.min(min, height);
          max = Math.max(max, height);
          sum += height;
        }
      }

      context.putImageData(pixels, 0, 0);
      document.getElementById('min').textContent = min.toFixed(3);
      document.getElementById('max').textContent = max.toFixed(3);
      document.getElementById('average').textContent = (sum / (sampleWidth * sampleHeight)).toFixed(3);
      document.getElementById('amplitude').textContent = fieldAmplitudeSum(octaves, persistence).toFixed(3);
      document.getElementById('status').textContent = controls.seed.value + ' · ' + sampleWidth + ' × ' + sampleHeight + ' samples';
    }

    function fieldAmplitudeSum(octaves, persistence) {
      let sum = 0;
      let amplitude = 1;
      for (let octave = 0; octave < octaves; octave += 1) {
        sum += amplitude;
        amplitude *= persistence;
      }
      return sum;
    }

    Object.values(controls).forEach((control) => control.addEventListener('input', render));
    document.getElementById('randomize').addEventListener('click', () => {
      controls.seed.value = String(Math.floor(Math.random() * 1000000));
      render();
    });

    render();
  </script>
</body>
</html>
